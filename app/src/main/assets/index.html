<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Amor de Princesa</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="brand-fix.css">
</head>
<body>
<div id="splash"><img src="logo.png" class="splash-logo-hd" alt="Amor de Princesa"></div>
<div class="app">
  <div class="head"><img src="logo.png" class="head-logo-hd" alt="Logo Amor de Princesa"><b>Amor de Princesa</b><span>🇦🇷</span></div>
  <main id="main"></main>
</div>
<nav class="bottom" aria-label="Navegación principal">
  <button onclick="go(0)" aria-label="Inicio"><span class="nav-icon">⌂</span><span>INICIO</span></button>
  <button onclick="go(4)" aria-label="Categoría"><span class="nav-icon">▦</span><span>CATEGORÍA</span></button>
  <button onclick="go(8)" aria-label="Carrito"><span class="nav-icon">🛒</span><span>CARRITO</span></button>
  <button onclick="openHelp()" aria-label="Ayuda"><span class="nav-icon">?</span><span>AYUDA</span></button>
</nav>
<script src="app.js"></script>
<script src="cash-mode.js"></script>
<script src="logo-hd.js"></script>
<script src="brand-auth-fix.js"></script>
<script>
function openHelp(){
  main.innerHTML=`<section class="screen help-screen"><img src="logo.png" class="screen-brand-logo" alt="Amor de Princesa"><h1>Ayuda</h1><div class="card"><h2>¿Necesitás ayuda?</h2><p>Podés volver al inicio, revisar las categorías o tu carrito desde la barra inferior.</p><button class="btn" onclick="go(0)">VOLVER AL INICIO</button></div></section>`;
  scrollTo(0,0);
}
</script>
</body>
</html>
