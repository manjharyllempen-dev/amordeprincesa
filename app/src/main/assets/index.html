<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Amor de Princesa</title><style>:root{--p:#ff6fa7;--pl:#ffd6e6;--l:#c8a2c8;--g:#c9a23a;--t:#333;--bg:#fff8fb}*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,select{font:inherit}.app{min-height:100dvh;padding-bottom:68px}.head{height:56px;padding:8px 12px;background:linear-gradient(135deg,var(--p),var(--l));color:white;display:flex;align-items:center;gap:9px;position:sticky;top:0;z-index:5}.head img{width:38px;height:38px;object-fit:contain;background:white;border-radius:9px}.head b{flex:1}.screen{padding:14px}.card{background:white;border:1px solid #efdce6;border-radius:16px;padding:14px;margin:9px 0}.hero{text-align:center}.hero img{width:min(55vw,170px)}h1{font-size:23px;margin:7px 0 10px}.small{font-size:12px;color:#7e6b77}.btn{width:100%;min-height:46px;padding:12px;border:0;border-radius:14px;background:var(--p);color:white;font-weight:700;margin-top:9px}.soft{background:var(--pl);color:#8d345b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid .card{margin:0}.price{font-size:20px;color:#a53664;font-weight:800}input,select{width:100%;min-height:46px;padding:11px;border:1px solid #e7d5df;border-radius:12px;margin:6px 0 8px;background:white}.msg{padding:10px 12px;border-radius:12px;margin:8px 0;font-size:13px}.ok{background:#e8f7ec;color:#236a38}.err{background:#ffe8ed;color:#8d2940}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:white;border-top:1px solid #eee;display:flex;padding:8px;gap:6px;z-index:6}.bottom button{flex:1;border:0;background:var(--l);color:white;border-radius:11px;font-size:11px;font-weight:700}.chip{display:inline-block;background:var(--pl);border-radius:999px;padding:7px 9px;margin:3px;font-size:13px}.admin{border-left:4px solid var(--g)}#splash{position:fixed;inset:0;background:white;z-index:9;display:flex;align-items:center;justify-content:center}#splash img{width:min(72vw,260px)}@media(max-width:360px){.screen{padding:11px}h1{font-size:21px}}</style></head><body><div id="splash"><img src="logo.png"></div><div class="app"><div class="head"><img src="logo.png"><b>Amor de Princesa</b><span>🇦🇷</span></div><main id="main"></main></div><div class="bottom"><button onclick="prev()">← ANTERIOR</button><button onclick="go(0)">⌂ INICIO</button><button onclick="next()">SIGUIENTE →</button></div><script>const SB='https://hrfhrstlofjhujmcqmkw.supabase.co',KEY='sb_publishable__3Kx_uHqjMgs1WcINJiDuQ_8aHOF-jK';let i=0,products=[],selected=null,cart=JSON.parse(localStorage.getItem('ap_cart')||'[]'),session=JSON.parse(localStorage.getItem('ap_session')||'null');const main=document.getElementById('main');function msg(t,type='ok'){return `<div class="msg ${type}">${t}</div>`}function go(n){i=Math.max(0,Math.min(22,n));draw()}function next(){go((i+1)%23)}function prev(){go((i+22)%23)}function money(n){return '$'+Number(n||0).toLocaleString('es-AR')+' ARS'}function screen(t,s,b){main.innerHTML=`<section class="screen"><div class="small">Pantalla ${i+1} de 23</div><h1>${t}</h1><p class="small">${s}</p>${b}</section>`;scrollTo(0,0)}async function api(path,opt={}){const h={'apikey':KEY,'Content-Type':'application/json',...(opt.headers||{})};if(session?.access_token)h.Authorization='Bearer '+session.access_token;const r=await fetch(SB+path,{...opt,headers:h});const tx=await r.text();let d=null;try{d=tx?JSON.parse(tx):null}catch{d=tx}if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||'Error de conexión');return d}async function register(){const name=rname.value.trim(),phone=rphone.value.trim(),email=remail.value.trim().toLowerCase(),password=rpass.value;if(!name||!email||password.length<6){rmsg.innerHTML=msg('Completá nombre, correo y una contraseña de al menos 6 caracteres.','err');return}rmsg.innerHTML=msg('Creando cuenta...');try{const d=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password,data:{full_name:name,phone}})});if(d.access_token){session=d;localStorage.setItem('ap_session',JSON.stringify(session));go(3)}else rmsg.innerHTML=msg('Cuenta creada. Si Supabase pide confirmación, revisá tu correo.')}catch(e){rmsg.innerHTML=msg(e.message,'err')}}async function login(){lmsg.innerHTML=msg('Ingresando...');try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:lemail.value.trim().toLowerCase(),password:lpass.value})});session=d;localStorage.setItem('ap_session',JSON.stringify(d));go(3)}catch(e){lmsg.innerHTML=msg(e.message,'err')}}function logout(){session=null;localStorage.removeItem('ap_session');go(0)}async function loadProducts(){try{products=await api('/rest/v1/products?select=id,name,description,category,price_ars,image_url,product_variants(id,model,color,size,stock)&is_active=eq.true&order=created_at.asc');draw()}catch(e){screen('Catálogo','Productos reales',msg(e.message,'err'))}}function openProduct(id){selected=products.find(p=>p.id===id);go(6)}function addCart(){if(!selected)return;const v=selected.product_variants?.[0];cart=[{name:selected.name,product_id:selected.id,variant_id:v?.id||null,model:v?.model||'',color:v?.color||'',size:v?.size||'',price:Number(selected.price_ars),qty:1}];localStorage.setItem('ap_cart',JSON.stringify(cart));go(8)}function draw(){let b='';switch(i){case 0:b=`<div class="hero card"><img src="logo.png"><h2>Bienvenida</h2><p>Moda, accesorios y más.</p></div><button class="btn" onclick="go(1)">INGRESAR</button><button class="btn soft" onclick="go(2)">CREAR CUENTA</button>${session?'<button class="btn soft" onclick="go(3)">CONTINUAR SESIÓN</button><button class="btn soft" onclick="logout()">CERRAR SESIÓN</button>':''}<button class="btn soft" onclick="go(12)">ACCESO ADMINISTRADOR</button>`;screen('Inicio','Tu tienda de moda y accesorios',b);break;case 1:b=`<input id="lemail" type="email" placeholder="Correo electrónico"><input id="lpass" type="password" placeholder="Contraseña"><div id="lmsg"></div><button class="btn" onclick="login()">INICIAR SESIÓN</button><button class="btn soft" onclick="go(2)">CREAR CUENTA</button>`;screen('Acceso cliente','Inicio de sesión real',b);break;case 2:b=`<input id="rname" placeholder="Nombre y apellido"><input id="rphone" placeholder="Teléfono +54"><input id="remail" type="email" placeholder="Correo"><input id="rpass" type="password" placeholder="Contraseña"><div id="rmsg"></div><button class="btn" onclick="register()">CREAR CUENTA REAL</button><button class="btn soft" onclick="go(1)">YA TENGO CUENTA</button>`;screen('Registro','Datos guardados en Supabase',b);break;case 3:b=`<div class="card"><b>${session?'Sesión iniciada':'Modo invitado'}</b><p>El catálogo ya usa datos reales.</p></div><div class="grid"><button class="card" onclick="go(4)">👗 Ropa</button><button class="card" onclick="go(4)">🧢 Gorras</button><button class="card" onclick="go(4)">⌚ Relojes</button><button class="card" onclick="go(4)">💎 Accesorios</button></div><button class="btn" onclick="go(4)">VER PRODUCTOS</button>`;screen('Inicio cliente','Backend conectado',b);break;case 4:if(!products.length){screen('Catálogo','Cargando productos...',msg('Conectando con la tienda...'));loadProducts();return}b=`<div class="grid">${products.map(p=>`<div class="card" onclick="openProduct('${p.id}')"><b>${p.name}</b><p class="small">${p.category}</p><div class="price">${money(p.price_ars)}</div></div>`).join('')}</div><button class="btn soft" onclick="go(5)">FILTROS</button>`;screen('Catálogo','Productos reales desde Supabase',b);break;case 5:b=`<div class="card"><span class="chip">Precio</span><span class="chip">Categoría</span><span class="chip">Color</span><span class="chip">Talle</span><span class="chip">Stock</span></div><button class="btn" onclick="go(4)">APLICAR FILTROS</button>`;screen('Filtros','Encontrá lo que buscás',b);break;case 6:if(!selected){go(4);return}b=`<div class="card hero">${selected.image_url?`<img src="${selected.image_url}" style="max-width:100%;border-radius:12px">`:'📷 Imagen del producto'}</div><h2>${selected.name}</h2><div class="price">${money(selected.price_ars)}</div><p>${selected.description||''}</p><button class="btn" onclick="go(7)">VER VARIANTES</button>`;screen('Detalle del producto',selected.category,b);break;case 7:if(!selected){go(4);return}b=`<div class="card">${(selected.product_variants||[]).map(v=>`<p><b>${v.model||'Modelo'}</b> · ${v.color||'-'} · ${v.size||'-'} · Stock ${v.stock}</p>`).join('')||'Sin variantes'}</div><button class="btn" onclick="addCart()">AGREGAR AL CARRITO</button>`;screen('Variantes','Stock real',b);break;case 8:{const c=cart[0];b=c?`<div class="card"><b>${c.name}</b><p>${c.model} · ${c.color} · ${c.size} · x${c.qty}</p><div class="price">${money(c.price)}</div></div><button class="btn" onclick="go(9)">CONTINUAR</button>`:`<div class="card">Tu carrito está vacío.</div>`;screen('Carrito','Tu compra',b);break}case 9:b=`<input placeholder="Nombre y apellido"><input placeholder="Calle y número"><input placeholder="Localidad"><select><option>Provincia</option><option>Buenos Aires</option><option>Córdoba</option><option>Santa Fe</option><option>Mendoza</option></select><input placeholder="Código postal"><button class="btn" onclick="go(10)">CONTINUAR AL PAGO</button>`;screen('Entrega','Datos de entrega',b);break;case 10:b=`<div class="card">💳 Tarjeta</div><div class="card">📱 Mercado Pago</div><div class="card">🏦 Transferencia</div><div class="card">💵 Pago al retirar</div><button class="btn" onclick="go(11)">CONFIRMAR PEDIDO DEMO</button>`;screen('Pago','Métodos de pago',b);break;case 11:b=`<div class="hero card"><div style="font-size:44px">🎉</div><b>#AP-000001</b><p>Pedido recibido</p></div><button class="btn" onclick="go(3)">SEGUIR COMPRANDO</button>`;screen('Confirmación','Pedido de demostración',b);break;case 12:b=`<div class="admin card"><input placeholder="Usuario / correo"><input type="password" placeholder="Contraseña"><button class="btn" onclick="go(13)">INICIAR SESIÓN ADMIN</button></div>`;screen('Acceso administrador','Panel protegido',b);break;case 13:b=`<div class="grid"><div class="card"><b>Ventas</b><p>$185.000</p></div><div class="card"><b>Pedidos</b><p>8</p></div><div class="card"><b>Productos</b><p>${products.length||4}</p></div><div class="card"><b>Clientes</b><p>—</p></div></div><button class="btn" onclick="go(14)">GESTIONAR PRODUCTOS</button>`;screen('Dashboard','Resumen administrador',b);break;case 14:b=`<div class="card">Catálogo conectado a Supabase.</div><button class="btn" onclick="go(15)">AGREGAR PRODUCTO</button><button class="btn soft" onclick="go(17)">PEDIDOS</button>`;screen('Gestión de productos','Siguiente módulo a conectar',b);break;case 15:b=`<input placeholder="Nombre"><select><option>Ropa</option><option>Gorras</option><option>Relojes</option><option>Accesorios</option></select><input placeholder="Precio ARS"><button class="btn" onclick="go(14)">GUARDAR (PRÓXIMA ETAPA)</button>`;screen('Agregar producto','Formulario preparado',b);break;case 16:b=`<div class="card">Edición de producto preparada para conectar.</div>`;screen('Editar producto','Administrador',b);break;case 17:b=`<div class="card">🟡 Pedido recibido</div><div class="card">🔵 Preparando</div><div class="card">🚚 Enviado</div>`;screen('Pedidos','Estados del pedido',b);break;case 18:b=`<div class="card">Cliente · productos · total · estado</div>`;screen('Detalle pedido','Administrador',b);break;case 19:b=`<div class="card">Clientes registrados aparecerán desde Supabase.</div>`;screen('Clientes','Base de clientes',b);break;case 20:b=`<div class="grid"><div class="card">Hoy<br><b>$185K</b></div><div class="card">Mes<br><b>$3,8M</b></div></div>`;screen('Ventas','Estadísticas',b);break;case 21:b=`<input placeholder="Título"><input placeholder="Mensaje"><button class="btn">ENVIAR (PRÓXIMA ETAPA)</button>`;screen('Notificaciones','Centro de avisos',b);break;case 22:b=`<div class="card">🏪 Datos de tienda</div><div class="card">💰 ARS</div><div class="card">🚚 Entregas</div><div class="card">💳 Pagos</div><div class="card">🔐 Seguridad</div>`;screen('Configuración','Preferencias',b);break}}draw();setTimeout(()=>document.getElementById('splash')?.remove(),1200);</script></body></html>
