<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Amor de Princesa</title><style>:root{--p:#ff6fa7;--pl:#ffd6e6;--l:#c8a2c8;--g:#c9a23a;--t:#333;--bg:#fff8fb}*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}.app{min-height:100dvh;padding-bottom:68px}.head{height:56px;padding:8px 12px;background:linear-gradient(135deg,var(--p),var(--l));color:#fff;display:flex;align-items:center;gap:9px;position:sticky;top:0;z-index:5}.head img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:9px}.head b{flex:1}.screen{padding:14px}.card{background:#fff;border:1px solid #efdce6;border-radius:16px;padding:14px;margin:9px 0;overflow:hidden}.hero{text-align:center}.hero img{width:min(55vw,170px);max-height:220px;object-fit:contain}h1{font-size:23px;margin:7px 0 10px}h2{font-size:19px}.small{font-size:12px;color:#7e6b77}.btn{width:100%;min-height:46px;padding:12px;border:0;border-radius:14px;background:var(--p);color:#fff;font-weight:700;margin-top:9px}.soft{background:var(--pl);color:#8d345b}.danger{background:#a72f48}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid .card{margin:0}.price{font-size:20px;color:#a53664;font-weight:800}input,select,textarea{width:100%;min-height:46px;padding:11px;border:1px solid #e7d5df;border-radius:12px;margin:6px 0 8px;background:#fff}textarea{min-height:82px;resize:vertical}.msg{padding:10px 12px;border-radius:12px;margin:8px 0;font-size:13px}.ok{background:#e8f7ec;color:#236a38}.err{background:#ffe8ed;color:#8d2940}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid #eee;display:flex;padding:8px;gap:6px;z-index:6}.bottom button{flex:1;border:0;background:var(--l);color:#fff;border-radius:11px;font-size:11px;font-weight:700}.chip{display:inline-block;background:var(--pl);border-radius:999px;padding:7px 9px;margin:3px;font-size:13px}.admin{border-left:4px solid var(--g)}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>*{min-width:0}.stock-ok{color:#26763c}.stock-low{color:#b06c00}.stock-out{color:#a72f48}.product-img{width:100%;height:120px;object-fit:cover;border-radius:12px;background:#f8eef3}.status{padding:7px 9px;border-radius:999px;background:#f3edf2;font-size:12px;display:inline-block}#splash{position:fixed;inset:0;background:#fff;z-index:9;display:flex;align-items:center;justify-content:center}#splash img{width:min(72vw,260px)}@media(max-width:360px){.screen{padding:11px}h1{font-size:21px}.grid{grid-template-columns:1fr}}</style></head><body><div id="splash"><img src="logo.png"></div><div class="app"><div class="head"><img src="logo.png"><b>Amor de Princesa</b><span>🇦🇷</span></div><main id="main"></main></div><div class="bottom"><button onclick="prev()">← ANTERIOR</button><button onclick="go(0)">⌂ INICIO</button><button onclick="next()">SIGUIENTE →</button></div><script>const SB='https://hrfhrstlofjhujmcqmkw.supabase.co',KEY='sb_publishable__3Kx_uHqjMgs1WcINJiDuQ_8aHOF-jK';let i=0,products=[],adminProducts=[],selected=null,selectedVariant=null,cart=JSON.parse(localStorage.getItem('ap_cart')||'[]'),session=JSON.parse(localStorage.getItem('ap_session')||'null'),profile=null,orders=[],editing=null,lastOrder=null;const main=document.getElementById('main');function msg(t,type='ok'){return `<div class="msg ${type}">${t}</div>`}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function go(n){i=Math.max(0,Math.min(22,n));draw()}function next(){go((i+1)%23)}function prev(){go((i+22)%23)}function money(n){return '$'+Number(n||0).toLocaleString('es-AR')+' ARS'}function screen(t,s,b){main.innerHTML=`<section class="screen"><div class="small">Pantalla ${i+1} de 23</div><h1>${t}</h1><p class="small">${s}</p>${b}</section>`;scrollTo(0,0)}async function api(path,opt={}){const h={'apikey':KEY,'Content-Type':'application/json',...(opt.headers||{})};if(session?.access_token)h.Authorization='Bearer '+session.access_token;const r=await fetch(SB+path,{...opt,headers:h});const tx=await r.text();let d=null;try{d=tx?JSON.parse(tx):null}catch{d=tx}if(!r.ok)throw new Error(d?.message||d?.msg||d?.error_description||d?.hint||'Error de conexión');return d}async function register(){const name=rname.value.trim(),phone=rphone.value.trim(),email=remail.value.trim().toLowerCase(),password=rpass.value;if(!name||!email||password.length<6){rmsg.innerHTML=msg('Completá nombre, correo y una contraseña de al menos 6 caracteres.','err');return}rmsg.innerHTML=msg('Creando cuenta...');try{const d=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password,data:{full_name:name,phone}})});if(d.access_token){session=d;localStorage.setItem('ap_session',JSON.stringify(d));await loadProfile();go(3)}else rmsg.innerHTML=msg('Cuenta creada. Revisá tu correo si se solicita confirmación.')}catch(e){rmsg.innerHTML=msg(e.message,'err')}}async function login(admin=false){const em=(admin?document.getElementById('aemail'):document.getElementById('lemail')).value.trim().toLowerCase(),pw=(admin?document.getElementById('apass'):document.getElementById('lpass')).value,box=admin?document.getElementById('amsg'):document.getElementById('lmsg');box.innerHTML=msg('Ingresando...');try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:em,password:pw})});session=d;localStorage.setItem('ap_session',JSON.stringify(d));await loadProfile();if(admin&&profile?.role!=='admin'){box.innerHTML=msg('Esta cuenta no tiene permisos de administrador.','err');return}go(admin?13:3)}catch(e){box.innerHTML=msg(e.message,'err')}}async function loadProfile(){if(!session?.user?.id){profile=null;return}try{const d=await api('/rest/v1/profiles?select=id,full_name,phone,role&id=eq.'+session.user.id);profile=d?.[0]||null}catch{profile=null}}function logout(){session=null;profile=null;localStorage.removeItem('ap_session');go(0)}async function loadProducts(redraw=true){try{products=await api('/rest/v1/products?select=id,name,description,category,price_ars,image_url,is_active,product_variants(id,model,color,size,sku,stock)&is_active=eq.true&order=created_at.asc');if(redraw)draw()}catch(e){if(redraw)screen('Catálogo','Productos reales',msg(e.message,'err'))}}async function loadAdminProducts(){try{adminProducts=await api('/rest/v1/products?select=id,name,description,category,price_ars,image_url,is_active,product_variants(id,model,color,size,sku,stock)&order=created_at.desc');draw()}catch(e){screen('Gestión de productos','Administrador',msg(e.message,'err'))}}function openProduct(id){selected=products.find(p=>p.id===id);selectedVariant=selected?.product_variants?.find(v=>v.stock>0)||selected?.product_variants?.[0]||null;go(6)}function pickVariant(id){selectedVariant=selected?.product_variants?.find(v=>v.id===id)||null;draw()}function addCart(){if(!selected||!selectedVariant||selectedVariant.stock<1){alert('Esta variante no tiene stock.');return}cart=[{name:selected.name,product_id:selected.id,variant_id:selectedVariant.id,model:selectedVariant.model||'',color:selectedVariant.color||'',size:selectedVariant.size||'',price:Number(selected.price_ars),qty:1}];localStorage.setItem('ap_cart',JSON.stringify(cart));go(8)}function qty(delta){if(!cart[0])return;cart[0].qty=Math.max(1,cart[0].qty+delta);localStorage.setItem('ap_cart',JSON.stringify(cart));draw()}async function checkout(){if(!session?.access_token){go(1);return}const c=cart[0];if(!c?.variant_id){paymsg.innerHTML=msg('El carrito no tiene una variante válida.','err');return}const address=JSON.parse(localStorage.getItem('ap_address')||'{}');paymsg.innerHTML=msg('Creando pedido y reservando stock...');try{const id=await api('/rest/v1/rpc/create_order_with_stock',{method:'POST',body:JSON.stringify({p_items:[{variant_id:c.variant_id,quantity:c.qty}],p_delivery_address:address,p_shipping_ars:0})});lastOrder=id;cart=[];localStorage.removeItem('ap_cart');await loadProducts(false);go(11)}catch(e){paymsg.innerHTML=msg(e.message.includes('insufficient_stock')?'No hay stock suficiente. Actualizamos el catálogo.':e.message,'err');await loadProducts(false)}}function saveAddress(){const a={full_name:dname.value.trim(),street:dstreet.value.trim(),city:dcity.value.trim(),province:dprovince.value,postal_code:dpostal.value.trim()};if(!a.full_name||!a.street||!a.city){dmsg.innerHTML=msg('Completá nombre, dirección y localidad.','err');return}localStorage.setItem('ap_address',JSON.stringify(a));go(10)}function parseVariants(text){return text.split('\n').map(x=>x.trim()).filter(Boolean).map((line,idx)=>{const [model='',color='',size='',sku='',stock='0']=line.split('|').map(s=>s.trim());return{model,color,size,sku:sku||('SKU-'+Date.now()+'-'+idx),stock:Math.max(0,parseInt(stock||'0',10)||0)}})}function editProduct(id){editing=adminProducts.find(p=>p.id===id)||null;go(16)}async function saveProduct(isEdit=false){const box=document.getElementById('pmsg');const body={p_product_id:isEdit?editing?.id:null,p_name:pname.value.trim(),p_description:pdesc.value.trim(),p_category:pcat.value,p_price_ars:Number(pprice.value||0),p_image_url:pimg.value.trim()||null,p_is_active:pactive.checked,p_variants:parseVariants(pvars.value)};if(!body.p_name||body.p_price_ars<0){box.innerHTML=msg('Revisá nombre y precio.','err');return}box.innerHTML=msg('Guardando producto y stock...');try{await api('/rest/v1/rpc/admin_upsert_product',{method:'POST',body:JSON.stringify(body)});editing=null;adminProducts=[];products=[];go(14)}catch(e){box.innerHTML=msg(e.message,'err')}}async function deleteProduct(){if(!editing||!confirm('¿Eliminar este producto?'))return;try{await api('/rest/v1/rpc/admin_delete_product',{method:'POST',body:JSON.stringify({p_product_id:editing.id})});editing=null;adminProducts=[];products=[];go(14)}catch(e){alert(e.message)}}async function loadOrders(){try{orders=await api('/rest/v1/orders?select=id,user_id,status,payment_status,subtotal_ars,shipping_ars,total_ars,delivery_address,created_at,order_items(id,product_name,model,color,size,quantity,unit_price_ars,line_total_ars)&order=created_at.desc');draw()}catch(e){screen('Pedidos','Administrador',msg(e.message,'err'))}}function orderDetail(id){lastOrder=orders.find(o=>o.id===id);go(18)}async function setOrderStatus(id,status){try{await api('/rest/v1/rpc/admin_update_order_status',{method:'POST',body:JSON.stringify({p_order_id:id,p_status:status})});orders=[];go(17)}catch(e){alert(e.message)}}async function dashboard(){try{if(!products.length)await loadProducts(false);const os=await api('/rest/v1/orders?select=id,total_ars,status,created_at&order=created_at.desc&limit=200');const ps=await api('/rest/v1/profiles?select=id,role');const today=new Date().toISOString().slice(0,10);const sales=os.filter(o=>o.created_at?.slice(0,10)===today&&o.status!=='cancelled').reduce((s,o)=>s+Number(o.total_ars||0),0);screen('Dashboard','Datos reales del backend',`<div class="grid"><div class="card"><b>${money(sales)}</b><p class="small">Ventas hoy</p></div><div class="card"><b>${os.length}</b><p class="small">Pedidos</p></div><div class="card"><b>${products.length}</b><p class="small">Productos activos</p></div><div class="card"><b>${ps.filter(p=>p.role==='customer').length}</b><p class="small">Clientes</p></div></div><button class="btn" onclick="go(14)">GESTIONAR PRODUCTOS</button><button class="btn soft" onclick="go(17)">GESTIONAR PEDIDOS</button>`)}catch(e){screen('Dashboard','Administrador',msg(e.message,'err'))}}function productForm(p){const vars=(p?.product_variants||[]).map(v=>[v.model||'',v.color||'',v.size||'',v.sku||'',v.stock].join('|')).join('\n');return `<input id="pname" placeholder="Nombre" value="${esc(p?.name||'')}"><textarea id="pdesc" placeholder="Descripción">${esc(p?.description||'')}</textarea><select id="pcat"><option ${p?.category==='Ropa'?'selected':''}>Ropa</option><option ${p?.category==='Gorras'?'selected':''}>Gorras</option><option ${p?.category==='Relojes'?'selected':''}>Relojes</option><option ${p?.category==='Accesorios'?'selected':''}>Accesorios</option></select><input id="pprice" type="number" min="0" placeholder="Precio ARS" value="${p?.price_ars??''}"><input id="pimg" placeholder="URL de imagen (opcional)" value="${esc(p?.image_url||'')}"><label class="card"><input id="pactive" type="checkbox" style="width:auto;min-height:auto" ${p?.is_active===false?'':'checked'}> Producto publicado</label><p class="small">Variantes: una por línea, formato Modelo|Color|Talle|SKU|Stock</p><textarea id="pvars" placeholder="Largo|Rosa|M|VEST-ROS-M|8">${esc(vars)}</textarea><div id="pmsg"></div>`}function draw(){let b='';switch(i){case 0:b=`<div class="hero card"><img src="logo.png"><h2>Bienvenida</h2><p>Moda, accesorios y más.</p></div><button class="btn" onclick="go(1)">INGRESAR</button><button class="btn soft" onclick="go(2)">CREAR CUENTA</button>${session?'<button class="btn soft" onclick="go(3)">CONTINUAR SESIÓN</button><button class="btn soft" onclick="logout()">CERRAR SESIÓN</button>':''}<button class="btn soft" onclick="go(12)">ACCESO ADMINISTRADOR</button>`;screen('Inicio','Tu tienda de moda y accesorios',b);break;case 1:b=`<input id="lemail" type="email" placeholder="Correo electrónico"><input id="lpass" type="password" placeholder="Contraseña"><div id="lmsg"></div><button class="btn" onclick="login(false)">INICIAR SESIÓN</button><button class="btn soft" onclick="go(2)">CREAR CUENTA</button>`;screen('Acceso cliente','Inicio de sesión real',b);break;case 2:b=`<input id="rname" placeholder="Nombre y apellido"><input id="rphone" placeholder="Teléfono +54"><input id="remail" type="email" placeholder="Correo"><input id="rpass" type="password" placeholder="Contraseña"><div id="rmsg"></div><button class="btn" onclick="register()">CREAR CUENTA REAL</button>`;screen('Registro','Cuenta guardada en Supabase',b);break;case 3:b=`<div class="card"><b>${profile?.full_name?'¡Hola '+esc(profile.full_name.split(' ')[0])+'!':'Bienvenida'}</b><p>El catálogo, el stock y los pedidos ya están conectados.</p></div><div class="grid"><button class="card" onclick="go(4)">👗 Ropa</button><button class="card" onclick="go(4)">🧢 Gorras</button><button class="card" onclick="go(4)">⌚ Relojes</button><button class="card" onclick="go(4)">💎 Accesorios</button></div><button class="btn" onclick="go(4)">VER PRODUCTOS</button>`;screen('Inicio cliente','Tienda online',b);break;case 4:if(!products.length){screen('Catálogo','Cargando productos...',msg('Conectando con la tienda...'));loadProducts();return}b=`<div class="grid">${products.map(p=>`<div class="card" onclick="openProduct('${p.id}')">${p.image_url?`<img class="product-img" src="${esc(p.image_url)}">`:''}<b>${esc(p.name)}</b><p class="small">${esc(p.category)}</p><div class="price">${money(p.price_ars)}</div><p class="small">Stock total: ${(p.product_variants||[]).reduce((s,v)=>s+Number(v.stock||0),0)}</p></div>`).join('')}</div><button class="btn soft" onclick="go(5)">FILTROS</button>`;screen('Catálogo','Productos y stock reales',b);break;case 5:b=`<div class="card"><span class="chip">Precio</span><span class="chip">Categoría</span><span class="chip">Color</span><span class="chip">Talle</span><span class="chip">Stock</span></div><button class="btn" onclick="go(4)">APLICAR FILTROS</button>`;screen('Filtros','Encontrá lo que buscás',b);break;case 6:if(!selected){go(4);return}b=`<div class="card hero">${selected.image_url?`<img src="${esc(selected.image_url)}">`:'📷 Imagen del producto'}</div><h2>${esc(selected.name)}</h2><div class="price">${money(selected.price_ars)}</div><p>${esc(selected.description||'')}</p><button class="btn" onclick="go(7)">VER VARIANTES</button>`;screen('Detalle del producto',selected.category,b);break;case 7:if(!selected){go(4);return}b=`<div class="card">${(selected.product_variants||[]).map(v=>`<label class="card"><input type="radio" name="variant" style="width:auto;min-height:auto" ${selectedVariant?.id===v.id?'checked':''} ${v.stock<1?'disabled':''} onclick="pickVariant('${v.id}')"> <b>${esc(v.model||'Modelo')}</b> · ${esc(v.color||'-')} · ${esc(v.size||'-')} · <span class="${v.stock<1?'stock-out':v.stock<3?'stock-low':'stock-ok'}">Stock ${v.stock}</span></label>`).join('')||'Sin variantes'}</div><button class="btn" onclick="addCart()">AGREGAR AL CARRITO</button>`;screen('Variantes','Elegí según stock disponible',b);break;case 8:{const c=cart[0];b=c?`<div class="card"><b>${esc(c.name)}</b><p>${esc(c.model)} · ${esc(c.color)} · ${esc(c.size)}</p><div class="row"><button class="btn soft" style="width:70px" onclick="qty(-1)">−</button><b>x${c.qty}</b><button class="btn soft" style="width:70px" onclick="qty(1)">＋</button></div><div class="price">${money(c.price*c.qty)}</div></div><button class="btn" onclick="go(9)">CONTINUAR</button>`:`<div class="card">Tu carrito está vacío.</div>`;screen('Carrito','Tu compra',b);break}case 9:{const a=JSON.parse(localStorage.getItem('ap_address')||'{}');b=`<input id="dname" placeholder="Nombre y apellido" value="${esc(a.full_name||'')}"><input id="dstreet" placeholder="Calle y número" value="${esc(a.street||'')}"><input id="dcity" placeholder="Localidad" value="${esc(a.city||'')}"><select id="dprovince"><option>Buenos Aires</option><option>Córdoba</option><option>Santa Fe</option><option>Mendoza</option><option>Otra</option></select><input id="dpostal" placeholder="Código postal" value="${esc(a.postal_code||'')}"><div id="dmsg"></div><button class="btn" onclick="saveAddress()">CONTINUAR AL PAGO</button>`;screen('Entrega','Datos del pedido',b);break}case 10:b=`<div class="card">💳 Tarjeta <span class="small">(Mercado Pago se conecta después)</span></div><div class="card">🏦 Transferencia</div><div class="card">💵 Pago al retirar</div><div id="paymsg"></div><button class="btn" onclick="checkout()">CONFIRMAR PEDIDO REAL</button>`;screen('Pago','El pedido descuenta stock automáticamente',b);break;case 11:b=`<div class="hero card"><div style="font-size:44px">🎉</div><b>Pedido creado</b><p class="small">ID: ${esc(typeof lastOrder==='string'?lastOrder:'')}</p><p>El inventario ya fue actualizado.</p></div><button class="btn" onclick="go(3)">SEGUIR COMPRANDO</button>`;screen('Confirmación','Pedido guardado en Supabase',b);break;case 12:b=`<div class="admin card"><input id="aemail" type="email" placeholder="Correo administrador"><input id="apass" type="password" placeholder="Contraseña"><div id="amsg"></div><button class="btn" onclick="login(true)">INICIAR SESIÓN ADMIN</button></div>`;screen('Acceso administrador','Solo cuentas con rol admin',b);break;case 13:if(!session||profile?.role!=='admin'){go(12);return}screen('Dashboard','Cargando datos reales...',msg('Actualizando...'));dashboard();break;case 14:if(profile?.role!=='admin'){go(12);return}if(!adminProducts.length){screen('Gestión de productos','Cargando inventario...',msg('Actualizando...'));loadAdminProducts();return}b=`${adminProducts.map(p=>`<div class="card admin"><div class="row"><div><b>${esc(p.name)}</b><p class="small">${esc(p.category)} · ${money(p.price_ars)} · ${p.is_active?'Publicado':'Oculto'}</p></div><span class="status">Stock ${(p.product_variants||[]).reduce((s,v)=>s+Number(v.stock||0),0)}</span></div><button class="btn soft" onclick="editProduct('${p.id}')">EDITAR PRODUCTO Y STOCK</button></div>`).join('')}<button class="btn" onclick="go(15)">＋ AGREGAR PRODUCTO</button><button class="btn soft" onclick="go(17)">VER PEDIDOS</button>`;screen('Gestión de productos','Catálogo editable en tiempo real',b);break;case 15:if(profile?.role!=='admin'){go(12);return}b=productForm(null)+`<button class="btn" onclick="saveProduct(false)">GUARDAR PRODUCTO</button>`;screen('Agregar producto','Producto y variantes reales',b);break;case 16:if(profile?.role!=='admin'){go(12);return}if(!editing){go(14);return}b=productForm(editing)+`<button class="btn" onclick="saveProduct(true)">GUARDAR CAMBIOS</button><button class="btn danger" onclick="deleteProduct()">ELIMINAR PRODUCTO</button>`;screen('Editar producto','Precio, variantes y stock',b);break;case 17:if(profile?.role!=='admin'){go(12);return}if(!orders.length){screen('Pedidos','Cargando pedidos reales...',msg('Actualizando...'));loadOrders();return}b=orders.map(o=>`<div class="card" onclick="orderDetail('${o.id}')"><div class="row"><b>${o.id.slice(0,8).toUpperCase()}</b><span class="status">${esc(o.status)}</span></div><p>${new Date(o.created_at).toLocaleString('es-AR')}</p><div class="price">${money(o.total_ars)}</div></div>`).join('')||'<div class="card">Todavía no hay pedidos.</div>';screen('Pedidos','Pedidos reales de clientes',b);break;case 18:if(profile?.role!=='admin'){go(12);return}{const o=typeof lastOrder==='object'?lastOrder:null;if(!o){go(17);return}b=`<div class="card"><b>Pedido ${o.id.slice(0,8).toUpperCase()}</b><p>Total: ${money(o.total_ars)}</p><p>Pago: ${esc(o.payment_status)}</p><p>Entrega: ${esc(JSON.stringify(o.delivery_address||{}))}</p></div>${(o.order_items||[]).map(x=>`<div class="card"><b>${esc(x.product_name)}</b><p>${esc(x.model||'')} · ${esc(x.color||'')} · ${esc(x.size||'')} · x${x.quantity}</p><p>${money(x.line_total_ars)}</p></div>`).join('')}<select id="ost"><option value="received" ${o.status==='received'?'selected':''}>Recibido</option><option value="preparing" ${o.status==='preparing'?'selected':''}>Preparando</option><option value="shipped" ${o.status==='shipped'?'selected':''}>Enviado</option><option value="delivered" ${o.status==='delivered'?'selected':''}>Entregado</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelado</option></select><button class="btn" onclick="setOrderStatus('${o.id}',ost.value)">ACTUALIZAR ESTADO</button>`;screen('Detalle pedido','Gestión real del pedido',b);break}case 19:b=`<div class="card">Los clientes se guardan en perfiles seguros de Supabase.</div>`;screen('Clientes','Base real de clientes',b);break;case 20:b=`<div class="card">Las ventas se calculan desde los pedidos reales del sistema.</div><button class="btn" onclick="go(13)">VER DASHBOARD REAL</button>`;screen('Ventas','Resumen comercial',b);break;case 21:b=`<input placeholder="Título"><textarea placeholder="Mensaje"></textarea><button class="btn soft">NOTIFICACIONES: PRÓXIMO MÓDULO</button>`;screen('Notificaciones','Centro de avisos',b);break;case 22:b=`<div class="card">🏪 Datos de tienda</div><div class="card">💰 Moneda: ARS</div><div class="card">🚚 Entregas</div><div class="card">💳 Pagos</div><div class="card">🔐 Seguridad</div>`;screen('Configuración','Preferencias',b);break}}(async()=>{if(session){await loadProfile()}draw();setTimeout(()=>document.getElementById('splash')?.remove(),1100)})();</script></body></html>
