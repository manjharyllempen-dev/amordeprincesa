<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Amor de Princesa</title>
<style>
:root{--p:#ff6fa7;--pl:#ffd6e6;--l:#c8a2c8;--g:#c9a23a;--t:#3a3040;--bg:#fff8fb}*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;font-family:Arial,sans-serif;background:var(--bg);color:var(--t);font-size:15px}button,input,select{font:inherit}#splash{position:fixed;inset:0;background:white;display:flex;align-items:center;justify-content:center;z-index:9}#splash img{width:min(72vw,260px);height:auto}.app{width:100%;min-height:100dvh;padding-bottom:74px}.head{height:58px;padding:8px 12px;background:linear-gradient(135deg,var(--p),var(--l));color:#fff;display:flex;align-items:center;gap:9px;position:sticky;top:0;z-index:5}.head img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:9px}.head b{flex:1;font-size:15px}.screen{width:100%;padding:14px 14px 18px;display:none}.screen.active{display:block}h1{font-size:23px;line-height:1.15;margin:7px 0 10px}h2{font-size:19px}.card{width:100%;background:#fff;border:1px solid #efdce6;border-radius:16px;padding:14px;margin:9px 0;box-shadow:0 4px 14px #a05a7a10}.hero{text-align:center}.hero img{width:min(55vw,170px);height:auto}.btn{width:100%;min-height:46px;padding:12px;border:0;border-radius:14px;background:var(--p);color:#fff;font-weight:700;font-size:15px;margin-top:9px}.soft{background:var(--pl);color:#8d345b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid .card{min-width:0;margin:0}.chip{display:inline-block;background:var(--pl);border-radius:999px;padding:7px 9px;margin:3px;font-size:13px}.price{font-size:21px;color:#a53664;font-weight:800}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.status{padding:10px;border-radius:12px;background:#fff;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{min-width:0;padding:12px;background:#fff;border-radius:14px;border:1px solid #efdce6}.stat b{font-size:19px;color:var(--p)}input,select{width:100%;min-height:46px;padding:11px;border:1px solid #e7d5df;border-radius:12px;margin:6px 0 8px;background:#fff;font-size:15px}.bottom{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid #eee;display:flex;padding:8px;gap:6px;z-index:6;padding-bottom:max(8px,env(safe-area-inset-bottom))}.bottom button{flex:1;border:0;background:var(--l);color:#fff;padding:9px 4px;border-radius:11px;font-size:11px;font-weight:700}.small{color:#7e6b77;font-size:12px}.admin{border-left:4px solid var(--g)}.msg{padding:10px 12px;border-radius:12px;margin:8px 0;background:#f3edf2;font-size:13px}.ok{background:#e8f7ec;color:#236a38}.err{background:#ffe8ed;color:#8d2940}.link{background:none;border:0;color:#a53664;text-decoration:underline;padding:10px 0;width:100%;font-weight:700}.product{cursor:pointer}.section-title{font-weight:800;margin:14px 0 7px}
@media(max-width:360px){html,body{font-size:14px}.screen{padding:11px}.head b{font-size:14px}h1{font-size:21px}.btn{font-size:14px}.bottom button{font-size:10px}}
</style>
</head>
<body>
<div id="splash"><img src="logo.png" alt="Amor de Princesa"></div>
<div class="app"><div class="head"><img src="logo.png"><b>Amor de Princesa</b><span>🇦🇷</span></div><main id="main"></main></div>
<div class="bottom"><button onclick="prev()">← ANTERIOR</button><button onclick="go(0)">⌂ INICIO</button><button onclick="next()">SIGUIENTE →</button></div>
<script>
let i=0, cart=JSON.parse(localStorage.getItem('ap_cart')||'[]');
const main=document.getElementById('main');
function msg(text,type='ok'){return `<div class="msg ${type}">${text}</div>`}
function saveCart(){localStorage.setItem('ap_cart',JSON.stringify(cart))}
function go(n){i=Math.max(0,Math.min(22,n));draw()}
function next(){go((i+1)%23)}function prev(){go((i-1+23)%23)}
function register(){const name=document.getElementById('rname').value.trim(),phone=document.getElementById('rphone').value.trim(),email=document.getElementById('remail').value.trim().toLowerCase(),pass=document.getElementById('rpass').value;if(!name||!email||pass.length<4){document.getElementById('rmsg').innerHTML=msg('Completá nombre, correo y una contraseña de al menos 4 caracteres.','err');return}localStorage.setItem('ap_user',JSON.stringify({name,phone,email,pass}));document.getElementById('rmsg').innerHTML=msg('Cuenta creada correctamente. Ya podés ingresar.');setTimeout(()=>go(1),700)}
function login(){const email=document.getElementById('lemail').value.trim().toLowerCase(),pass=document.getElementById('lpass').value,u=JSON.parse(localStorage.getItem('ap_user')||'null');if(u&&u.email===email&&u.pass===pass){localStorage.setItem('ap_session','1');go(3)}else{document.getElementById('lmsg').innerHTML=msg('Datos incorrectos. Si todavía no tenés cuenta, tocá CREAR CUENTA.','err')}}
function adminLogin(){localStorage.setItem('ap_admin','1');go(13)}
function addCart(){cart=[{name:'Vestido elegante',model:'Largo',color:'Rosa',size:'M',price:35000,qty:1}];saveCart();go(8)}
function clearDemo(){localStorage.removeItem('ap_user');localStorage.removeItem('ap_session');localStorage.removeItem('ap_cart');cart=[];go(0)}
function money(n){return '$'+Number(n).toLocaleString('es-AR')+' ARS'}
function screen(title,sub,body){main.innerHTML=`<section class="screen active"><div class="small">Pantalla ${i+1} de 23</div><h1>${title}</h1><p class="small">${sub}</p>${body}</section>`;window.scrollTo(0,0)}
function draw(){
let b='';
switch(i){
case 0:b=`<div class="hero card"><img src="logo.png"><h2>Bienvenida</h2><p>Moda, accesorios y más.</p></div><button class="btn" onclick="go(1)">INGRESAR</button><button class="btn soft" onclick="go(2)">CREAR CUENTA</button><button class="link" onclick="go(12)">Acceso administrador</button>`;screen('Inicio','Tu tienda de moda y accesorios',b);break;
case 1:b=`<input id="lemail" type="email" placeholder="Correo electrónico"><input id="lpass" type="password" placeholder="Contraseña"><div id="lmsg"></div><button class="btn" onclick="login()">INICIAR SESIÓN</button><button class="btn soft" onclick="go(2)">CREAR CUENTA</button>`;screen('Acceso cliente','Ingresá a tu cuenta',b);break;
case 2:b=`<input id="rname" placeholder="Nombre y apellido"><input id="rphone" placeholder="Teléfono +54"><input id="remail" type="email" placeholder="Correo"><input id="rpass" type="password" placeholder="Contraseña"><div id="rmsg"></div><button class="btn" onclick="register()">CREAR CUENTA</button><button class="link" onclick="go(1)">Ya tengo cuenta</button>`;screen('Registro','Crear una cuenta',b);break;
case 3:{const u=JSON.parse(localStorage.getItem('ap_user')||'null');b=`<div class="card"><b>¡Hola${u?' '+u.name.split(' ')[0]:''}!</b><p>Encontrá tu próximo look favorito.</p></div><div class="grid"><button class="card" onclick="go(4)">👗 Ropa</button><button class="card" onclick="go(4)">🧢 Gorras</button><button class="card" onclick="go(4)">⌚ Relojes</button><button class="card" onclick="go(4)">💎 Accesorios</button></div><button class="btn" onclick="go(4)">VER PRODUCTOS</button>`;screen('Inicio cliente','Descubrí novedades',b);break}
case 4:b=`<input placeholder="🔎 Buscar productos"><div class="grid"><div class="card product" onclick="go(6)"><b>Vestido elegante</b><br><span class="price">$35.000</span></div><div class="card"><b>Gorra rosa</b><br><span class="price">$18.000</span></div><div class="card"><b>Reloj dorado</b><br><span class="price">$45.000</span></div><div class="card"><b>Cartera</b><br><span class="price">$22.000</span></div></div><button class="btn soft" onclick="go(5)">FILTROS</button>`;screen('Catálogo','Nuestros productos',b);break;
case 5:b=`<div class="card"><span class="chip">Precio</span><span class="chip">Categoría</span><span class="chip">Color</span><span class="chip">Talle</span><span class="chip">Stock</span></div><button class="btn" onclick="go(4)">APLICAR FILTROS</button>`;screen('Filtros','Encontrá lo que buscás',b);break;
case 6:b=`<div class="card hero">📷 Foto del producto</div><div class="price">$35.000 ARS</div><p>Prenda elegante y cómoda.</p><button class="btn" onclick="go(7)">VER VARIANTES</button>`;screen('Detalle del producto','Vestido elegante',b);break;
case 7:b=`<div class="card"><b>Modelo</b><p><span class="chip">Largo</span><span class="chip">Corto</span><span class="chip">Casual</span></p><b>Colores</b><p><span class="chip">Rosa</span><span class="chip">Azul</span><span class="chip">Verde</span><span class="chip">Gris</span><span class="chip">Negro</span></p><b>Talles</b><p><span class="chip">S</span><span class="chip">M</span><span class="chip">L</span><span class="chip">XL</span></p><p>🟢 Stock: 8</p></div><button class="btn" onclick="addCart()">AGREGAR AL CARRITO</button>`;screen('Variantes','Elegí tu combinación',b);break;
case 8:{const item=cart[0];b=item?`<div class="card"><b>${item.name}</b><p>${item.model} · ${item.color} · ${item.size} · x${item.qty}</p><div class="price">${money(item.price)}</div></div><div class="card"><div class="row"><span>Subtotal</span><b>${money(item.price)}</b></div><div class="row"><span>Envío</span><b>A calcular</b></div></div><button class="btn" onclick="go(9)">CONTINUAR</button>`:`<div class="card">Tu carrito está vacío.</div><button class="btn" onclick="go(4)">IR A PRODUCTOS</button>`;screen('Carrito','Tu compra',b);break}
case 9:b=`<input placeholder="Nombre y apellido"><input placeholder="Calle y número"><input placeholder="Localidad"><select><option>Provincia</option><option>Buenos Aires</option><option>Córdoba</option><option>Santa Fe</option><option>Mendoza</option></select><input placeholder="Código postal"><button class="btn" onclick="go(10)">CONTINUAR AL PAGO</button>`;screen('Entrega','Datos de entrega',b);break;
case 10:b=`<div class="card">💳 Tarjeta</div><div class="card">📱 Mercado Pago</div><div class="card">🏦 Transferencia</div><div class="card">💵 Pago al retirar</div><button class="btn" onclick="go(11)">CONFIRMAR PEDIDO DEMO</button>`;screen('Pago','Método de pago',b);break;
case 11:b=`<div class="hero card"><div style="font-size:44px">🎉</div><b>#AP-000001</b><p>🟡 Pedido recibido</p><div class="price">$35.000 ARS</div></div><button class="btn" onclick="go(3)">SEGUIR COMPRANDO</button>`;screen('Confirmación','¡Pedido confirmado!',b);break;
case 12:b=`<div class="admin card"><input placeholder="Usuario / correo"><input type="password" placeholder="Contraseña"><button class="btn" onclick="adminLogin()">🔐 INICIAR SESIÓN</button><button class="btn soft" onclick="adminLogin()">👆 ENTRAR CON HUELLA (DEMO)</button></div>`;screen('Acceso administrador','Panel de administración',b);break;
case 13:b=`<div class="stats"><div class="stat"><b>$185.000</b><br><small>Ventas hoy</small></div><div class="stat"><b>8</b><br><small>Pedidos</small></div><div class="stat"><b>156</b><br><small>Productos</small></div><div class="stat"><b>89</b><br><small>Clientes</small></div></div><div class="card">⚠️ 5 productos con stock bajo</div><button class="btn" onclick="go(14)">GESTIONAR PRODUCTOS</button>`;screen('Dashboard','Resumen de la tienda',b);break;
case 14:b=`<input placeholder="🔎 Buscar producto"><div class="card"><b>Vestido elegante</b><p>Rosa, Azul, Verde, Gris · S/M/L</p><p>Stock: 8</p><button class="btn soft" onclick="go(16)">✏️ EDITAR</button></div><button class="btn" onclick="go(15)">＋ AGREGAR PRODUCTO</button><button class="btn soft" onclick="go(17)">VER PEDIDOS</button>`;screen('Gestión de productos','Administrar catálogo',b);break;
case 15:b=`<input placeholder="Nombre"><select><option>Ropa</option><option>Gorras</option><option>Relojes</option><option>Accesorios</option></select><input placeholder="Precio ARS"><div class="card">＋ Agregar fotos<br><br>＋ Agregar modelo<br><br>＋ Agregar más colores<br><br>＋ Agregar talle<br><br>📦 Stock por combinación</div><button class="btn" onclick="go(14)">GUARDAR PRODUCTO DEMO</button>`;screen('Agregar producto','Nuevo producto',b);break;
case 16:b=`<div class="card"><b>Vestido elegante</b><p>Modelo: Largo</p><p>Azul · M · Stock 5</p><p>Verde · M · Stock 3</p><p>Gris · L · Stock 4</p></div><button class="btn" onclick="go(14)">💾 GUARDAR CAMBIOS</button><button class="btn soft" onclick="go(14)">🗑️ ELIMINAR</button>`;screen('Editar producto','Modificar producto',b);break;
case 17:b=`<button class="status" onclick="go(18)">🟡 #AP-000125 · Recibido</button><div class="status">🔵 #AP-000124 · Preparando</div><div class="status">🚚 #AP-000123 · Enviado</div><div class="status">🟢 #AP-000122 · Entregado</div>`;screen('Pedidos','Gestionar pedidos',b);break;
case 18:b=`<div class="card"><b>María González</b><p>Vestido elegante · Largo · Azul · M</p><p>📍 Dirección de entrega</p><div class="price">$65.000 ARS</div></div><div class="card">Recibido → Preparando → Enviado → Entregado</div><button class="btn" onclick="alert('Estado actualizado en esta demo')">ACTUALIZAR ESTADO</button><button class="btn soft" onclick="go(19)">VER CLIENTES</button>`;screen('Detalle pedido','Pedido #AP-000125',b);break;
case 19:b=`<input placeholder="Buscar nombre, teléfono o correo"><div class="card"><b>María González</b><p>8 pedidos · $245.000 ARS</p><p>🟢 Activa</p></div><button class="btn" onclick="go(20)">VER VENTAS</button>`;screen('Clientes','Clientes registrados',b);break;
case 20:b=`<div class="stats"><div class="stat"><b>$185K</b><br><small>Hoy</small></div><div class="stat"><b>$920K</b><br><small>Semana</small></div><div class="stat"><b>$3,8M</b><br><small>Mes</small></div><div class="stat"><b>24</b><br><small>Pedidos</small></div></div><div class="card">🏆 Más vendido: Vestido elegante</div><button class="btn" onclick="go(21)">NOTIFICACIONES</button>`;screen('Ventas','Ventas y estadísticas',b);break;
case 21:b=`<input placeholder="Título"><input placeholder="Mensaje"><select><option>Todos los clientes</option><option>Clientes nuevos</option><option>Cliente específico</option></select><button class="btn" onclick="alert('Notificación guardada en modo demo')">ENVIAR NOTIFICACIÓN DEMO</button><div class="card">🔥 Nueva colección · enviada</div><button class="btn soft" onclick="go(22)">CONFIGURACIÓN</button>`;screen('Notificaciones','Centro de notificaciones',b);break;
case 22:b=`<div class="card">🏪 Datos de la tienda</div><div class="card">💰 Moneda: ARS</div><div class="card">🚚 Entregas</div><div class="card">💳 Métodos de pago</div><div class="card">🔔 Notificaciones</div><div class="card">🔐 Seguridad y huella</div><button class="btn soft" onclick="clearDemo()">REINICIAR DATOS DE LA DEMO</button>`;screen('Configuración','Configuración de la tienda',b);break;
}}
draw();setTimeout(()=>{const s=document.getElementById('splash');if(s)s.remove()},1200);
</script>
</body></html>
