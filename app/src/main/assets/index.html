<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amor de Princesa</title>
<style>
:root{--p:#ff6fa7;--pl:#ffd6e6;--l:#c8a2c8;--g:#c9a23a;--t:#3a3040;--bg:#fff8fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}#splash{position:fixed;inset:0;background:white;display:flex;align-items:center;justify-content:center;z-index:9}#splash img{width:72vw;max-width:300px}.app{min-height:100vh;padding-bottom:78px}.head{padding:14px 18px;background:linear-gradient(135deg,var(--p),var(--l));color:#fff;display:flex;align-items:center;gap:10px;position:sticky;top:0}.head img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:10px}.head b{flex:1}.screen{padding:20px;display:none}.screen.active{display:block}h1{font-size:27px;margin:8px 0 16px}.card{background:#fff;border:1px solid #efdce6;border-radius:18px;padding:16px;margin:11px 0;box-shadow:0 5px 18px #a05a7a10}.hero{text-align:center}.hero img{width:190px;max-width:70vw}.btn{width:100%;padding:15px;border:0;border-radius:16px;background:var(--p);color:#fff;font-weight:700;font-size:16px;margin-top:10px}.soft{background:var(--pl);color:#8d345b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chip{display:inline-block;background:var(--pl);border-radius:999px;padding:8px 11px;margin:3px}.price{font-size:24px;color:#a53664;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.status{padding:11px;border-radius:13px;background:#fff;margin:7px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:15px;background:#fff;border-radius:16px;border:1px solid #efdce6}.stat b{font-size:22px;color:var(--p)}input,select{width:100%;padding:13px;border:1px solid #e7d5df;border-radius:13px;margin:7px 0 10px;background:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;padding:9px;gap:7px}.bottom button{flex:1;border:0;background:var(--l);color:#fff;padding:12px 6px;border-radius:12px;font-size:12px}.small{color:#7e6b77;font-size:13px}.admin{border-left:4px solid var(--g)}
</style>
</head>
<body>
<div id="splash"><img src="logo.png" alt="Amor de Princesa"></div>
<div class="app"><div class="head"><img src="logo.png"><b>Amor de Princesa</b><span>🇦🇷</span></div><main id="main"></main></div>
<div class="bottom"><button onclick="prev()">← Anterior</button><button onclick="home()">⌂ Inicio</button><button onclick="next()">Siguiente →</button></div>
<script>
const S=[
['Inicio','Tu tienda de moda y accesorios','<div class="hero card"><img src="logo.png"><h2>Bienvenida</h2><p>Moda, accesorios y más.</p></div><button class="btn">INGRESAR</button><button class="btn soft">CREAR CUENTA</button>'],
['Acceso cliente','Ingresá a tu cuenta','<input placeholder="Correo electrónico"><input type="password" placeholder="Contraseña"><button class="btn">INICIAR SESIÓN</button>'],
['Registro','Crear una cuenta','<input placeholder="Nombre y apellido"><input placeholder="Teléfono +54"><input placeholder="Correo"><input type="password" placeholder="Contraseña"><button class="btn">CREAR CUENTA</button>'],
['Inicio cliente','Descubrí novedades','<div class="card"><b>Nueva colección</b><p>Encontrá tu próximo look favorito.</p></div><div class="grid"><div class="card">👗 Ropa</div><div class="card">🧢 Gorras</div><div class="card">⌚ Relojes</div><div class="card">💎 Accesorios</div></div>'],
['Catálogo','Nuestros productos','<input placeholder="🔎 Buscar productos"><div class="grid"><div class="card">Vestido elegante<br><span class="price">$35.000</span></div><div class="card">Gorra rosa<br><span class="price">$18.000</span></div><div class="card">Reloj dorado<br><span class="price">$45.000</span></div><div class="card">Cartera<br><span class="price">$22.000</span></div></div>'],
['Filtros','Encontrá lo que buscás','<div class="card"><span class="chip">Precio</span><span class="chip">Categoría</span><span class="chip">Color</span><span class="chip">Talle</span><span class="chip">Stock</span></div>'],
['Detalle del producto','Vestido elegante','<div class="card hero">📷 Foto del producto</div><div class="price">$35.000 ARS</div><p>Prenda elegante y cómoda.</p><button class="btn">VER VARIANTES</button>'],
['Variantes','Elegí tu combinación','<div class="card"><b>Modelo</b><p>Largo · Corto · Casual</p><b>Colores</b><p><span class="chip">Rosa</span><span class="chip">Azul</span><span class="chip">Verde</span><span class="chip">Gris</span><span class="chip">Negro</span></p><b>Talles</b><p>S · M · L · XL</p><p>🟢 Stock: 8</p></div><button class="btn">AGREGAR AL CARRITO</button>'],
['Carrito','Tu compra','<div class="card"><b>Vestido elegante</b><p>Modelo Largo · Rosa · M · x1</p><div class="price">$35.000</div></div><div class="card"><div class="row"><span>Subtotal</span><b>$35.000</b></div><div class="row"><span>Envío</span><b>A calcular</b></div></div><button class="btn">CONTINUAR</button>'],
['Entrega','Datos de entrega','<input placeholder="Nombre y apellido"><input placeholder="Calle y número"><input placeholder="Localidad"><select><option>Provincia</option><option>Buenos Aires</option><option>Córdoba</option><option>Santa Fe</option><option>Mendoza</option></select><input placeholder="Código postal"><button class="btn">CONTINUAR AL PAGO</button>'],
['Pago','Método de pago','<div class="card">💳 Tarjeta</div><div class="card">📱 Mercado Pago</div><div class="card">🏦 Transferencia</div><div class="card">💵 Pago al retirar</div><button class="btn">CONFIRMAR</button>'],
['Confirmación','¡Pedido confirmado!','<div class="hero card"><div style="font-size:50px">🎉</div><b>#AP-000001</b><p>🟡 Pedido recibido</p><div class="price">$35.000 ARS</div></div><button class="btn">VER MI PEDIDO</button>'],
['Acceso administrador','Panel de administración','<div class="admin card"><input placeholder="Usuario / correo"><input type="password" placeholder="Contraseña"><button class="btn">🔐 INICIAR SESIÓN</button><button class="btn soft">👆 ENTRAR CON HUELLA</button></div>'],
['Dashboard','Resumen de la tienda','<div class="stats"><div class="stat"><b>$185.000</b><br><small>Ventas hoy</small></div><div class="stat"><b>8</b><br><small>Pedidos</small></div><div class="stat"><b>156</b><br><small>Productos</small></div><div class="stat"><b>89</b><br><small>Clientes</small></div></div><div class="card">⚠️ 5 productos con stock bajo</div>'],
['Gestión de productos','Administrar catálogo','<input placeholder="🔎 Buscar producto"><div class="card"><b>Vestido elegante</b><p>Rosa, Azul, Verde, Gris · S/M/L</p><p>Stock: 8</p><button class="btn soft">✏️ EDITAR</button></div><button class="btn">＋ AGREGAR PRODUCTO</button>'],
['Agregar producto','Nuevo producto','<input placeholder="Nombre"><select><option>Ropa</option><option>Gorras</option><option>Relojes</option><option>Accesorios</option></select><input placeholder="Precio ARS"><div class="card">＋ Agregar fotos<br>＋ Agregar modelo<br>＋ Agregar más colores<br>＋ Agregar talle<br>📦 Stock por combinación</div><button class="btn">GUARDAR PRODUCTO</button>'],
['Editar producto','Modificar producto','<div class="card"><b>Vestido elegante</b><p>Modelo: Largo</p><p>Azul · M · Stock 5</p><p>Verde · M · Stock 3</p><p>Gris · L · Stock 4</p></div><button class="btn">💾 GUARDAR CAMBIOS</button><button class="btn soft">🗑️ ELIMINAR</button>'],
['Pedidos','Gestionar pedidos','<div class="status">🟡 #AP-000125 · Recibido</div><div class="status">🔵 #AP-000124 · Preparando</div><div class="status">🚚 #AP-000123 · Enviado</div><div class="status">🟢 #AP-000122 · Entregado</div>'],
['Detalle pedido','Pedido #AP-000125','<div class="card"><b>María González</b><p>Vestido elegante · Largo · Azul · M</p><p>📍 Dirección de entrega</p><div class="price">$65.000 ARS</div></div><div class="card">Recibido → Preparando → Enviado → Entregado</div><button class="btn">ACTUALIZAR ESTADO</button>'],
['Clientes','Clientes registrados','<input placeholder="Buscar nombre, teléfono o correo"><div class="card"><b>María González</b><p>8 pedidos · $245.000 ARS</p><p>🟢 Activa</p></div>'],
['Ventas','Ventas y estadísticas','<div class="stats"><div class="stat"><b>$185K</b><br><small>Hoy</small></div><div class="stat"><b>$920K</b><br><small>Semana</small></div><div class="stat"><b>$3,8M</b><br><small>Mes</small></div><div class="stat"><b>24</b><br><small>Pedidos</small></div></div><div class="card">🏆 Más vendido: Vestido elegante</div>'],
['Notificaciones','Centro de notificaciones','<input placeholder="Título"><input placeholder="Mensaje"><select><option>Todos los clientes</option><option>Clientes nuevos</option><option>Cliente específico</option></select><button class="btn">ENVIAR NOTIFICACIÓN</button><div class="card">🔥 Nueva colección · enviada</div>'],
['Configuración','Configuración de la tienda','<div class="card">🏪 Datos de la tienda</div><div class="card">💰 Moneda: ARS</div><div class="card">🚚 Entregas</div><div class="card">💳 Métodos de pago</div><div class="card">🔔 Notificaciones</div><div class="card">🔐 Seguridad y huella</div>']
];
let i=0;const main=document.getElementById('main');
function draw(){const s=S[i];main.innerHTML=`<section class="screen active"><div class="small">Pantalla ${i+1} de 23</div><h1>${s[0]}</h1><p class="small">${s[1]}</p>${s[2]}</section>`;scrollTo(0,0)}
function next(){i=(i+1)%S.length;draw()}function prev(){i=(i-1+S.length)%S.length;draw()}function home(){i=0;draw()}draw();setTimeout(()=>document.getElementById('splash').remove(),1500);
</script>
</body></html>
