name: CiviMoto - Compilar APKs

on:
  push:
    branches: [main, civimoto-beta]
    paths:
      - 'civitaxi/**'
      - '.github/workflows/civitaxi-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'civitaxi/**'
      - '.github/workflows/civitaxi-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar tres APK beta
        working-directory: civitaxi
        run: gradle :usuario:assembleDebug :chofer:assembleDebug :administrador:assembleDebug --stacktrace

      - name: Preparar APKs
        run: |
          mkdir -p dist
          cp civitaxi/usuario/build/outputs/apk/debug/usuario-debug.apk dist/CiviMoto-Pasajero.apk
          cp civitaxi/chofer/build/outputs/apk/debug/chofer-debug.apk dist/CiviMoto-Chofer.apk
          cp civitaxi/administrador/build/outputs/apk/debug/administrador-debug.apk dist/CiviMoto-Administrador.apk
          sha256sum dist/CiviMoto-*.apk > dist/CiviMoto-SHA256SUMS.txt

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: CiviMoto-3-APK-Beta
          path: |
            dist/CiviMoto-Pasajero.apk
            dist/CiviMoto-Chofer.apk
            dist/CiviMoto-Administrador.apk
            dist/CiviMoto-SHA256SUMS.txt

      - name: Guardar APKs en repositorio
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/CiviMoto-*.apk dist/CiviMoto-SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: publicar APKs CiviMoto beta [skip ci]'
          git push
